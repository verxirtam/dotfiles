<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ホスト別配色一覧 (ps1 / tmux)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --card-bg: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e;
  }
  :root[data-theme="light"] {
    --bg: #f6f8fa; --card-bg: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #57606a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 0.25rem;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    overflow-x: auto;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card h2 .key {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.05rem 0.4rem;
  }
  .prompt-line {
    font-family: var(--mono);
    font-size: 0.85rem;
    background: #000;
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    margin-bottom: 0.6rem;
    white-space: nowrap;
    overflow-x: auto;
  }
  .tmux-status {
    font-family: var(--mono);
    font-size: 0.8rem;
    border-radius: 4px;
    padding: 0.3rem 0.6rem;
    margin-bottom: 0.6rem;
    display: flex;
    justify-content: space-between;
  }
  .panes {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.7rem;
  }
  .pane {
    flex: 1;
    background: #000;
    border-radius: 4px;
    padding: 0.5rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: #888;
    text-align: center;
  }
  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    font-family: var(--mono);
    font-size: 0.7rem;
  }
  .swatch {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.15rem 0.4rem 0.15rem 0.15rem;
  }
  .dot {
    width: 0.9rem;
    height: 0.9rem;
    border-radius: 3px;
    border: 1px solid rgba(128,128,128,0.4);
    flex-shrink: 0;
  }
  .muted-note {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 0.4rem;
  }
</style>
</head>
<body>

<h1>ホスト別配色一覧</h1>
<p class="sub">各ホストの ps1.sh (プロンプト) / tmux.conf (ステータスバー・ペイン枠) の配色を一覧表示します。色は hosts/&lt;host&gt;/ 配下の設定ファイルから抽出しています。</p>

<div class="grid" id="grid"></div>

<script>
// xterm-256 index -> hex
function xtermToHex(n) {
  n = Number(n);
  if (n < 16) {
    const basic = [
      '#000000','#800000','#008000','#808000','#000080','#800080','#008080','#c0c0c0',
      '#808080','#ff0000','#00ff00','#ffff00','#0000ff','#ff00ff','#00ffff','#ffffff'
    ];
    return basic[n];
  }
  if (n >= 16 && n <= 231) {
    const i = n - 16;
    const r = Math.floor(i / 36);
    const g = Math.floor((i % 36) / 6);
    const b = i % 6;
    const level = v => v === 0 ? 0 : 55 + v * 40;
    const toHex = v => level(v).toString(16).padStart(2, '0');
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  }
  // grayscale 232-255
  const gray = 8 + (n - 232) * 10;
  const h = gray.toString(16).padStart(2, '0');
  return `#${h}${h}${h}`;
}

function colorToHex(spec) {
  if (spec === null || spec === undefined) return null;
  if (typeof spec === 'string') {
    if (spec === 'black') return '#000000';
    if (spec === 'white') return '#ffffff';
    if (spec === 'default') return null;
  }
  return xtermToHex(spec);
}

// PS1_2/3/4/6 の色コード文字列 (例 '00;38;05;211') から xterm番号を抽出。
// '00' のように色指定が無いものは null (端末既定色) として扱う。
function extractCode(colorStr) {
  const m = colorStr.match(/38;05;(\d+)/);
  return m ? Number(m[1]) : null;
}

const hosts = [
  {
    name: 'daisuke-brix',
    ps1: '00;38;05;211',

    tmuxBg: 211, tmuxFg: 'black', border: 52, activeBorder: 183,

  {

    prefix: 'C-j',
    tmuxBg: 106, tmuxFg: 'black', border: 22, activeBorder: 112,
  },
  {
    name: 'daisuke-letsnote',
    ps1: '00;38;05;211',
    prefix: 'C-u',
    tmuxBg: 211, tmuxFg: 'black', border: 88, activeBorder: 183,
  },
  {
    name: 'daisuke-msi',
    ps1: '00;38;05;211',
    prefix: 'C-u',
    tmuxBg: 211, tmuxFg: 'black', border: 52, activeBorder: 183,
  },
  {
    name: 'daisuke-msipc',
    ps1: '00',
    prefix: 'C-t',
    tmuxBg: 245, tmuxFg: 'black', border: 236, activeBorder: 'white',
  },
  {
    name: 'daisuke-raspi01',

    prefix: 'C-y',

  },
  {
    name: 'daisuke-raspi02',
    ps1: '00;38;05;87',
    prefix: 'C-k',
    tmuxBg: 87, tmuxFg: 'black', border: 30, activeBorder: 123,
  },
  {
    name: 'daisuke-raspi03',
    ps1: '00;38;05;82',
    prefix: 'C-u',
    tmuxBg: 82, tmuxFg: 'black', border: 22, activeBorder: 118,
  },
  {
    name: 'daisuke-raspi04',
    ps1: '00;38;05;51',
    prefix: 'C-l',
    tmuxBg: 51, tmuxFg: 'black', border: 23, activeBorder: 87,
  },
  {
    name: 'daisuke-raspi05',
    ps1: '00;38;05;201',
    prefix: 'C-l',
    tmuxBg: 201, tmuxFg: 'black', border: 90, activeBorder: 213,
  },
  {

  },
  {
    name: 'daisuke-raspi07',
    ps1: '00;38;05;196',
    prefix: 'C-l',
    tmuxBg: 196, tmuxFg: 'black', border: 88, activeBorder: 203,
  },
  {
    name: 'daisuke-raspi08',
    ps1: '00;38;05;63',
    prefix: 'C-l',
    tmuxBg: 63, tmuxFg: 'black', border: 18, activeBorder: 105,
  },
  {
    name: 'daisukenuc',
    ps1: '00;38;05;39',
    prefix: 'C-u',
    tmuxBg: 39, tmuxFg: 'black', border: 24, activeBorder: 45,
  },
  {
    name: 'dev',
    ps1: '00;38;05;227',
    prefix: 'C-g',
    tmuxBg: 227, tmuxFg: 'black', border: 58, activeBorder: 226,
  },
];

const grid = document.getElementById('grid');

function swatch(label, code, hex) {
  const dotStyle = hex ? `background:${hex}` : 'background:transparent;border-style:dashed';
  const valueText = hex ? `${code} (${hex})` : '既定色';
  return `<div class="swatch"><span class="dot" style="${dotStyle}"></span><span>${label}: ${valueText}</span></div>`;
}

hosts.forEach(h => {
  const ps1Code = extractCode(h.ps1);
  const ps1Hex = colorToHex(ps1Code);
  const promptColor = ps1Hex || '#c9d1d9';

  const bgHex = colorToHex(h.tmuxBg);
  const fgHex = colorToHex(h.tmuxFg);
  const borderHex = colorToHex(h.border);
  const activeBorderHex = colorToHex(h.activeBorder);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>${h.name} <span class="key">${h.prefix}</span></h2>

    <div class="prompt-line">
      <span style="color:${promptColor}">daisuke@${h.name}</span><span style="color:${promptColor}">:</span><span style="color:${promptColor}">~/tools/dotfiles</span><span style="color:#c9d1d9">$ </span><span style="color:#888">_</span>
    </div>

    <div class="tmux-status" style="background:${bgHex || '#333'};color:${fgHex || '#fff'}">
      <span>0:bash*</span><span>${h.name}</span>
    </div>

    <div class="panes">
      <div class="pane" style="border:2px solid ${borderHex || '#555'}">inactive pane</div>
      <div class="pane" style="border:2px solid ${activeBorderHex || '#555'}">active pane</div>
    </div>

    <div class="swatches">
      ${swatch('ps1', ps1Code, ps1Hex)}
      ${swatch('status-bg', h.tmuxBg, bgHex)}
      ${swatch('border', h.border, borderHex)}
      ${swatch('active-border', h.activeBorder, activeBorderHex)}
    </div>
  `;
  grid.appendChild(card);
});
</script>

</body>
</html>
